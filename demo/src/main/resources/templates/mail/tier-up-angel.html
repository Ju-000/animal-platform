<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:24px;background:#f7f4ef;font-family:Arial,'Malgun Gothic',sans-serif;color:#222;">
<div style="max-width:640px;margin:auto;background:#fff;border-radius:20px;padding:28px;">
  <h1 style="margin:0 0 12px;color:#f97316;">👼 천사 후원자가 되셨어요!</h1>
  <p th:text="${userName} + '님, 특별한 감사의 마음을 전합니다.'">특별한 감사의 마음을 전합니다.</p>
  <p><strong th:text="${helpedAnimalCount}">1</strong>마리 이상의 아이들에게 도움이 닿았어요.</p>
  <p>천사 후원자 전용 감사 스토리와 주간 보호소 소식을 전해드릴게요.</p>
</div>
</body>
</html>
