<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관심 동물 상태 변경</title>
</head>
<body style="margin:0;padding:0;background:#f7f4ef;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#222;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f4ef;padding:28px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border-radius:24px;overflow:hidden;">
                <tr>
                    <td style="padding:28px 28px 18px;">
                        <p style="margin:0 0 8px;color:#ff8a00;font-weight:800;letter-spacing:.04em;">포동포동 알림</p>
                        <h1 style="margin:0;font-size:26px;line-height:1.35;">관심 동물의 상태가 변경되었습니다</h1>
                        <p style="margin:14px 0 0;color:#555;line-height:1.6;">
                            <span th:text="${userName}">보호자</span>님이 관심 등록한 동물의 최신 공고 상태를 확인해주세요.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 28px 24px;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#fff8ed;border-radius:20px;overflow:hidden;">
                            <tr>
                                <td style="width:180px;vertical-align:top;background:#efe9df;">
                                    <img th:if="${thumbnailUrl != null and !#strings.isEmpty(thumbnailUrl)}"
                                         th:src="${thumbnailUrl}"
                                         alt="동물 사진"
                                         style="display:block;width:180px;height:180px;object-fit:cover;">
                                    <div th:unless="${thumbnailUrl != null and !#strings.isEmpty(thumbnailUrl)}"
                                         style="width:180px;height:180px;display:grid;place-items:center;color:#9b6d49;font-weight:800;">
                                        NO IMAGE
                                    </div>
                                </td>
                                <td style="padding:20px;vertical-align:top;">
                                    <h2 style="margin:0 0 12px;font-size:22px;" th:text="${animalName}">동물 이름</h2>
                                    <p style="margin:0 0 14px;color:#555;">상태 변경</p>
                                    <p style="margin:0;font-size:18px;font-weight:800;">
                                        <span style="color:#777;" th:text="${previousStatus}">보호중</span>
                                        <span style="color:#aaa;"> → </span>
                                        <span th:class="${newStatusClass}"
                                              th:style="${newStatusClass == 'danger' ? 'color:#e44836;' : (newStatusClass == 'success' ? 'color:#26a66a;' : 'color:#ff8a00;')}"
                                              th:text="${newStatus}">입양완료</span>
                                    </p>
                                    <a th:href="${detailUrl}"
                                       style="display:inline-block;margin-top:20px;padding:12px 18px;border-radius:999px;background:#ff9815;color:#fff;text-decoration:none;font-weight:800;">
                                        상세 페이지 보기
                                    </a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 28px 28px;color:#777;font-size:13px;line-height:1.6;">
                        이 메일은 관심 동물 상태 변경 알림 설정이 켜져 있어 발송되었습니다.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
